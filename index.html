<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday!</title>
    <meta name="description" content="A personalised birthday wish. Pass ?name= in the URL to customise." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <div class="birthday-text" id="birthdayText">
        <div class="starburst" aria-hidden="true"></div>
        <span class="line line--happy-birthday">Happy Birthday</span>
        <span class="line line--name" id="birthdayName"></span>
        <p class="click-hint" id="clickHint">tap to spin</p>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
